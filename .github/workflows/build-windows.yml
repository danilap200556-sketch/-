name: Build Windows exe

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'CMakeLists.txt'
      - '.github/workflows/build-windows.yml'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.3'
          arch: 'win64_msvc2019_64'
          modules: ''

      - name: Bootstrap vcpkg
        shell: cmd
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git
          call vcpkg\bootstrap-vcpkg.bat

      - name: Install libqrencode via vcpkg
        shell: cmd
        run: |
          vcpkg\vcpkg.exe install libqrencode:x64-windows

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        shell: cmd
        run: |
          cmake -S . -B build -G "NMake Makefiles" ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DCMAKE_PREFIX_PATH="${{ env.Qt6_DIR }}" ^
            -DCMAKE_TOOLCHAIN_FILE="%GITHUB_WORKSPACE%\vcpkg\scripts\buildsystems\vcpkg.cmake" ^
            -DVCPKG_TARGET_TRIPLET=x64-windows

      - name: Build
        shell: cmd
        run: cmake --build build

      - name: Locate build output
        id: locate
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path build -Recurse -Filter inventory_manager.exe | Select-Object -First 1
          if (-not $exe) { throw "inventory_manager.exe not found" }
          Write-Host "Found: $($exe.FullName)"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item $exe.FullName dist\
          "exeDir=dist" >> $env:GITHUB_OUTPUT

      - name: Deploy Qt dependencies (windeployqt)
        shell: cmd
        run: |
          windeployqt.exe dist\inventory_manager.exe

      - name: Copy libqrencode runtime DLL
        shell: pwsh
        run: |
          Copy-Item "vcpkg\installed\x64-windows\bin\qrencode.dll" dist\ -ErrorAction SilentlyContinue

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: inventory_manager-windows
          path: dist\**
