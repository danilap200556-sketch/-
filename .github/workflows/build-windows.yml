name: Build Windows exe

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'CMakeLists.txt'
      - 'tools/make_update_package.py'
      - '.github/workflows/build-windows.yml'

# contents: write - чтобы публиковать релиз app-latest, из которого программа берёт обновления.
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # вся история: из сообщений коммитов собирается «что нового» для обновления

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.3'
          arch: 'win64_msvc2019_64'
          modules: ''

      - name: Bootstrap vcpkg
        shell: cmd
        # vcpkg.exe скачивается из релизов github.com, который иногда отвечает 504: три попытки с паузой, а если не вышло -
        # берём vcpkg.exe, уже установленный на раннере (C:\vcpkg): он чуть старее, но для сборки зависимостей подходит.
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git
          for %%i in (1 2 3) do (
            call vcpkg\bootstrap-vcpkg.bat && goto :bootstrapped
            echo vcpkg bootstrap failed, attempt %%i of 3
            ping -n 31 127.0.0.1 > nul
          )
          if exist C:\vcpkg\vcpkg.exe (
            echo Using the vcpkg.exe preinstalled on the runner
            copy /y C:\vcpkg\vcpkg.exe vcpkg\vcpkg.exe && goto :bootstrapped
          )
          exit /b 1
          :bootstrapped

      # Для сборки OpenSSL vcpkg скачивает Strawberry Perl из релизов github.com, и этот файл иногда не отдаётся (504 часами).
      # На раннере Windows Strawberry Perl уже установлен: кладём его туда, где vcpkg ищет свой, и тогда скачивание не нужно.
      # Если подготовить не вышло, шаг ничего не ломает: vcpkg скачает Perl сам, как раньше.
      - name: Prepare Perl for vcpkg (preinstalled Strawberry Perl instead of a download)
        shell: pwsh
        continue-on-error: true
        run: |
          $perlRoot = 'C:\Strawberry'
          if (-not (Test-Path "$perlRoot\perl\bin\perl.exe")) { Write-Host 'No preinstalled Strawberry Perl: vcpkg will download its own'; exit 0 }
          $hit = Get-ChildItem vcpkg\scripts\cmake -File | Select-String -Pattern 'strawberry-perl-([0-9.]+)-64bit-portable' | Select-Object -First 1
          if (-not $hit) { Write-Host 'Perl version not found in the vcpkg scripts'; exit 0 }
          $ver = $hit.Matches[0].Groups[1].Value
          $dest = Join-Path (Resolve-Path vcpkg).Path "downloads\tools\perl\$ver"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          foreach ($d in 'perl', 'c') {
            if ((Test-Path "$perlRoot\$d") -and -not (Test-Path "$dest\$d")) { cmd /c mklink /J "$dest\$d" "$perlRoot\$d" }
          }
          Write-Host "vcpkg will use Perl $ver from $dest"
          & "$dest\perl\bin\perl.exe" -v | Select-Object -First 2

      - name: Install libqrencode and libpq via vcpkg
        shell: cmd
        # Зависимости собираются из исходников и качают инструменты (Strawberry Perl) из релизов github.com: он иногда отвечает 504,
        # поэтому до пяти попыток с паузой (сбой скачивания не должен ронять всю сборку).
        run: |
          for %%i in (1 2 3 4 5) do (
            vcpkg\vcpkg.exe install libqrencode:x64-windows libpq:x64-windows && goto :installed
            echo vcpkg install failed, attempt %%i of 5
            ping -n 61 127.0.0.1 > nul
          )
          exit /b 1
          :installed

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build TLS diagnostic tool (tlsdiag.exe)
        shell: cmd
        run: |
          mkdir dist_diag
          cl.exe /I vcpkg\installed\x64-windows\include tools\tlsdiag.c ^
            /link /LIBPATH:vcpkg\installed\x64-windows\lib libssl.lib libcrypto.lib libpq.lib ws2_32.lib secur32.lib wldap32.lib ^
            /out:dist_diag\tlsdiag.exe
          copy vcpkg\installed\x64-windows\bin\*.dll dist_diag\

      - name: Configure
        shell: cmd
        run: |
          rem Qt is found via PATH (install-qt-action adds its bin dir).
          rem REQUIRE_QPSQL_EMBEDDED makes configure fail loudly instead of
          rem silently shipping the plain-QPSQL fallback, which can't connect
          rem to Neon at all.
          rem APP_BUILD / APP_COMMIT - номер и коммит этой сборки: по ним программа узнаёт, что вышла новая версия.
          cmake -S . -B build -G "NMake Makefiles" ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DAPP_BUILD=%GITHUB_RUN_NUMBER% ^
            -DAPP_COMMIT=%GITHUB_SHA:~0,7% ^
            -DREQUIRE_QPSQL_EMBEDDED=ON ^
            -DCMAKE_TOOLCHAIN_FILE="%GITHUB_WORKSPACE%\vcpkg\scripts\buildsystems\vcpkg.cmake" ^
            -DVCPKG_TARGET_TRIPLET=x64-windows

      - name: Build
        shell: cmd
        run: cmake --build build

      - name: Locate build output
        id: locate
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path build -Recurse -Filter inventory_manager.exe | Select-Object -First 1
          if (-not $exe) { throw "inventory_manager.exe not found" }
          Write-Host "Found: $($exe.FullName)"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item $exe.FullName dist\
          "exeDir=dist" >> $env:GITHUB_OUTPUT

      - name: Deploy Qt dependencies (windeployqt)
        shell: cmd
        run: |
          windeployqt.exe dist\inventory_manager.exe

      # Without a TLS backend plugin every HTTPS request to the Market API fails
      # with "TLS initialization failed", so don't ship a build that lacks it.
      - name: Check TLS plugin for Market API (HTTPS)
        shell: pwsh
        run: |
          $tls = Get-ChildItem dist\tls -Filter *.dll -ErrorAction SilentlyContinue
          if (-not $tls) { throw "windeployqt did not deploy any TLS backend plugin into dist\tls" }
          $tls | ForEach-Object { Write-Host "TLS plugin: $($_.Name)" }

      - name: Copy vcpkg runtime DLLs (qrencode, libpq + its deps)
        shell: pwsh
        run: |
          Copy-Item "vcpkg\installed\x64-windows\bin\*.dll" dist\ -ErrorAction SilentlyContinue

      - name: Copy PostgreSQL Qt driver plugin
        shell: pwsh
        run: |
          $qtBin = (Get-Command windeployqt.exe).Source
          $qtRoot = Split-Path (Split-Path $qtBin -Parent) -Parent
          New-Item -ItemType Directory -Force -Path dist\sqldrivers | Out-Null
          Copy-Item "$qtRoot\plugins\sqldrivers\qsqlpsql*.dll" dist\sqldrivers\ -ErrorAction SilentlyContinue
          Get-ChildItem dist\sqldrivers

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: inventory_manager-windows
          path: dist\**

      # Обновления внутри программы: архив + version.json в релизе app-latest (вкладка «Обновления», src/updater.cpp).
      - name: Package update (zip + version.json)
        id: pack
        shell: pwsh
        run: |
          $prev = "prev_version.json"
          try {
            Invoke-WebRequest -UseBasicParsing -Uri "https://github.com/$env:GITHUB_REPOSITORY/releases/download/app-latest/version.json" -OutFile $prev
          } catch {
            Remove-Item $prev -ErrorAction SilentlyContinue
          }
          python tools/make_update_package.py --dist dist --zip inventory_manager-windows.zip --manifest version.json `
            --notes release_notes.md --build $env:GITHUB_RUN_NUMBER --sha $env:GITHUB_SHA --prev $prev
          if ($LASTEXITCODE -eq 3) { "publish=false" >> $env:GITHUB_OUTPUT; exit 0 }
          if ($LASTEXITCODE -ne 0) { throw "make_update_package.py failed ($LASTEXITCODE)" }
          "publish=true" >> $env:GITHUB_OUTPUT

      - name: Publish update (release app-latest)
        if: steps.pack.outputs.publish == 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete app-latest --cleanup-tag --yes
          $global:LASTEXITCODE = 0
          gh release create app-latest inventory_manager-windows.zip version.json --target $env:GITHUB_SHA `
            --title "Программа для Windows, сборка $env:GITHUB_RUN_NUMBER" --notes-file release_notes.md --latest
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed ($LASTEXITCODE)" }

      - name: Package qtpgtest (real Qt/QSqlQuery diagnostic)
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path build -Recurse -Filter qtpgtest.exe | Select-Object -First 1
          if (-not $exe) { throw "qtpgtest.exe not found" }
          Copy-Item $exe.FullName dist_diag\
          windeployqt.exe dist_diag\qtpgtest.exe --no-widgets
          Copy-Item "vcpkg\installed\x64-windows\bin\*.dll" dist_diag\ -ErrorAction SilentlyContinue
          $qtBin = (Get-Command windeployqt.exe).Source
          $qtRoot = Split-Path (Split-Path $qtBin -Parent) -Parent
          New-Item -ItemType Directory -Force -Path dist_diag\sqldrivers | Out-Null
          Copy-Item "$qtRoot\plugins\sqldrivers\qsqlpsql*.dll" dist_diag\sqldrivers\ -ErrorAction SilentlyContinue

      - name: Upload TLS/Qt diagnostic tools
        uses: actions/upload-artifact@v4
        with:
          name: tlsdiag-windows
          path: dist_diag\**
